include:
    - local: /gitlab-ci/common.yaml

variables:
  K8S_FOUNDATION: "tt-prd2103"
  K8S_DOMAIN: "$K8S_FOUNDATION.tke.t-mobile.com"
  K8S_NS: "cdp-helloworld-stg"
  K8S_API_LOGIN_URL: "pksapi.tt-prd2103.tke.t-mobile.com"
  K8S_CLUSTER: "api-$K8S_DOMAIN"
  K8S_SERVER_URL: "https://api-$K8S_DOMAIN:8443"
  HELM_VALUES: "./k8s-tke/values.yaml"
  HELM_APP_NAME: $CI_PROJECT_NAME
  HELM_CHARTS_DIR: "./k8s-tke/"
  HELM_HISTORY_MAX: "3"
  HELM_WAIT: "true"

# Deploy on TKE/PKS(Gen4) K8s cluster
tt-stg2103:
  stage: deploy
  extends: .helm_deploy
  environment:
    name: stg/tt-prd2103
    url: $DYNAMIC_ENVIRONMENT_URL/login
    deployment_tier: staging
  resource_group: $CI_JOB_NAME

tt-stg2103-sanity:
  extends: .sanity
  needs: ["tt-stg2103"]
  dependencies: ["tt-stg2103"]
  environment:
    name: stg/$K8S_FOUNDATION/development/smoke
    action: verify
