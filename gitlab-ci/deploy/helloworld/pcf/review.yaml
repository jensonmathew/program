include:
    - local: /gitlab-ci/common.yaml

variables:
  PCF_ROUTE_HOSTNAME: review-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG
  PCF_APP_NAME: review-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG
  PCF_FOUNDATION: "px-npe02a"
  DOMAIN: "dev.$PCF_FOUNDATION.cf.t-mobile.com"
  PCF_API: "api.sys.px-npe02a.cf.t-mobile.com"

px-npe02a:
  extends: .deploy-pcf
  resource_group: review-deploy-$CI_COMMIT_REF_SLUG
  environment:
    name: review/$PCF_FOUNDATION/$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG
    url: $DYNAMIC_ENVIRONMENT_URL
    deployment_tier: development
    on_stop: stop-px-npe02a
    auto_stop_in: 2 days

px-npe02a-sanity:
  extends: .sanity
  needs: ["px-npe02a"]
  dependencies: ["px-npe02a"]
  environment:
    name: review/$PCF_FOUNDATION/$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG
    action: prepare

stop-px-npe02a:
  extends: .pcf-teardown
  stage: stop
  needs: ["px-npe02a"]
  resource_group: review-deploy-$CI_COMMIT_REF_SLUG
  environment:
    name: review/$PCF_FOUNDATION/$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG
    action: stop
    deployment_tier: development
  rules:
    - when: manual
      allow_failure: true

delete-all-routes-apps-px-npe02a:
  extends: .pcf_all_teardown
  resource_group: stop_all_px-npe02a
  environment:
    name: review/$PCF_FOUNDATION/$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG
    action: stop
