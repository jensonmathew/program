include:
    - local: /gitlab-ci/common.yaml

predeploysample:
  image: alpine
  stage: test
  script:
    - echo http://$PCF_ROUTE_HOSTNAME.$DOMAIN

# px-prod02
px-prd02:
  extends: .deploy-pcf
  variables:
    PCF_API: "api.sys.px-prd02.cf.t-mobile.com"
    PCF_SPACE: "production"
    DOMAIN: "apps.px-prd02.cf.t-mobile.com"
  environment:
    name: prod/px-prd02/smoke
    url: $DYNAMIC_ENVIRONMENT_URL
    deployment_tier: production

px-prd02-sanity:
  extends: .sanity
  needs: ["px-prd02"]
  dependencies: ["px-prd02"]
  environment:
    name: prod/px-prd02/smoke
    action: prepare #will be changed to "verify" hopefully in future
    deployment_tier: "production"

