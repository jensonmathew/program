include:
    - local: /gitlab-ci/common.yaml

##################################### Deploy px-prd02 ###############################################
   # Deploy to production environment    
deploy-px-prd02-prd:
  extends: .deploy-pcf
  variables:
    PCF_API: "api.sys.px-prd02.cf.t-mobile.com"
    PCF_SPACE: "production"
    DOMAIN: "apps.px-prd02.cf.t-mobile.com"
  environment:
    name: prod/px-prd02/production/smoke
    url: ${PCF_ROUTE_HOSTNAME}.${DOMAIN}
    deployment_tier: production

