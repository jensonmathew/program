include:
    - local: /gitlab-ci/common.yaml

##################################### Deploy px-cde02 ################################################
# Deploy to production environment    
deploy-px-cde02a-prd:
  extends: .deploy-pcf
  variables:
        PCF_API: "api.sys.px-cde02.cf.t-mobile.com"
        PCF_SPACE: "production"
        DOMAIN: "apps.px-cde02.cf.t-mobile.com"
  environment:
    name: prod/px-cde02/production/smoke
    url: ${PCF_ROUTE_HOSTNAME}.${DOMAIN}
    deployment_tier: production

