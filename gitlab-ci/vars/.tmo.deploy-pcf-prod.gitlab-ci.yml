#################################### Anchor Deploy PX-PRD #########################################  
.deploy-px-prd_prod:
  stage: deploy
  extends: .pcf-deploy
  rules:
    - if: "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" || "$DEPLOY_ALL" == "true"
      when: on_success
    - when: never
  resource_group: $CI_JOB_NAME
      
##################################### Deploy px-prd02 ###############################################
   # Deploy to production environment    
deploy-px-prd02-prd:
  extends: 
     - .deploy-px-prd_prod
     - .vars_px-prd02_prod
  environment:
    name: prod/px-prd02/production/smoke
    url: ${PCF_ROUTE_HOSTNAME}.${DOMAIN}
    deployment_tier: production

