########################### Anchor Deploy PX-NPE ##############################################

.deploy-px-npe:
  stage: deploy
  extends: .pcf-deploy
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - if: $CI_COMMIT_REF_NAME == "$CI_DEFAULT_BRANCH"
      when: on_success
    - if: $CI_COMMIT_REF_NAME != "$CI_DEFAULT_BRANCH" && $DEPLOY_ALL == "true"
      when: on_success
    - when: never
  resource_group: $CI_JOB_NAME

.deploy-review:
  stage: deploy
  extends: .pcf-deploy
  variables:
    PCF_ROUTE_HOSTNAME: review-$CI_PROJET_NAME-$CI_COMMIT_SHORT_SHA
    PCF_APP_NAME: review-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - if: $CI_COMMIT_REF_NAME != "$CI_DEFAULT_BRANCH"
      when: on_success
    - when: never
  resource_group: $CI_JOB_NAME
    
##################################### Deploy px-npe02a ################################################
# Deploy to Development environment
deploy-npe02a-dev:
  extends:
     - .deploy-px-npe
  variables:
        PCF_API: "api.sys.px-npe02a.cf.t-mobile.com"
        PCF_SPACE: $CI_ENVIRONMENT_TIER
        DOMAIN: "dev.px-npe02a.cf.t-mobile.com"
  environment:
    name: dlab01/px-npe02a/development/smoke
    url: ${PCF_ROUTE_HOSTNAME}.${DOMAIN}
    deployment_tier: development
  
# Deploy to Staging environment   
deploy-npe02a-stg:
  extends: 
     - .deploy-px-npe
  variables:
    PCF_API: "api.sys.px-npe02a.cf.t-mobile.com"
    PCF_SPACE: $CI_ENVIRONMENT_TIER
    DOMAIN: "test.px-npe02a.cf.t-mobile.com"
  environment:
    name: stg01/px-npe02a/staging/smoke 
    url: ${PCF_ROUTE_HOSTNAME}.${DOMAIN}
    deployment_tier: staging

