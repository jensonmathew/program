#################################### Anchor Deploy PX-CDE #########################################

.deploy-px-cde_prod:
  stage: deploy
  extends: .pcf-deploy
  rules:
    - if: $CI_COMMIT_REF_NAME == "$CI_DEFAULT_BRANCH"
      when: on_success
    - if: $CI_COMMIT_REF_NAME != "$CI_DEFAULT_BRANCH" && $DEPLOY_ALL == "true"
      when: on_success
    - when: never
  resource_group: $CI_JOB_NAME
      
##################################### Deploy px-cde02 ################################################
# Deploy to production environment    
deploy-px-cde02a-prd:
  extends: 
     - .deploy-px-cde_prod
     - .vars_px-cde02_prod
  environment:
    name: prod/px-cde02/production/smoke
    url: ${PCF_ROUTE_HOSTNAME}.${DOMAIN}
    deployment_tier: production

