include:
  - project: tmobile/templates
    file:
      - /gitlab-ci/.tmo.global.common.gitlab-ci.yml
      - /gitlab-ci/.tmo.function.pcf.gitlab-ci.yml
      - /gitlab-ci/.tmo.function.helm-deploy.gitlab-ci.yml
      - /gitlab-ci/.tmo.function.newman.gitlab-ci.yml
      - /gitlab-ci/.tmo.function.helm-rollback.gitlab-ci.yml

stages:
    - tmo
    - test
    - deploy
    - post-deploy
    - promote
    - verify
    - rollback
    - verify-rollback
    - stop

variables:
    PCF_ORG: "Continuous-Delivery-Platform"
    BUILDPACK: "java_buildpack_offline"
    PCF_INSTANCES: "1"
    PCF_ROUTE_HOSTNAME: "helloworld"
    PCF_BG_STRATEGY: "GREEN_AUTO_SWITCH"
    PCF_SPACE: $CI_ENVIRONMENT_TIER
    PCF_TLOGGER: "true"
    HELM_VERSION: "v3.8.1"
    HELM_VALUES: "./k8s/values.yaml"
    HELM_CHART_DIR: "./k8s"
    HELM_HISTORY_MAX: "3"
    HELM_WAIT: "true"

.deploy: &deploy
  extends: .pcf-deploy
  stage: deploy
  resource_group: $CI_JOB_NAME
  rules:
    - when: always

.deploy-pcf:
  <<: *deploy
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: build

.sanity:
  extends: .newman_test
  stage: verify
  variables:
    test_report_path: "newman/"
    qtest_info_path: "src/test/sanity/qtest_info.json"
    NEWMAN_QTEST_PUBLISH: "true"
    POSTMAN_COLLECTION: "src/test/sanity"
    POSTMAN_ITERATIONS: "100"

.pcf_all_teardown:
  extends: .pcf-teardown
  stage: stop
  variables:
    PCF_DELETE_ALL_ROUTES_APPS: "true"
  rules:
    - if: $DELETE_ALL == "true" #only topic branches
      when: manual
      allow_failure: true
    - when: never

.k8s_teardown:
  extends: .helm_uninstall
  stage: stop
  rules:
    - if: $DELETE_ALL == "true" #only topic branches
      when: manual
      allow_failure: true
    - when: never

.validate_app:
  image: bash
  variables:
    TEST_ITERATION: "50"
  script:
    - bash src/test/sanity/validate-app.sh
  retry: 1
  when: delayed
  start_in: 60 seconds
  tags:
    - tiny
