include:
    - local: /.gitlab-ci/common.yaml

# Deploy on TKE/PKS(Gen4) K8s cluster

# [px-prd5103] - Nginx Canary Deployment
.px-prd5103-vars:
  variables:
    K8S_FOUNDATION: "px-prd5103"
    HELM_APP_NAME: $CI_PROJECT_NAME
    K8S_DOMAIN: "$K8S_FOUNDATION.tke.t-mobile.com"
    K8S_API_LOGIN_URL: "pksapi.$K8S_FOUNDATION.tke.t-mobile.com"
    K8S_CLUSTER: "api-$K8S_FOUNDATION.tke.t-mobile.com"
    K8S_SERVER_URL: "https://api-$K8S_FOUNDATION.tke.t-mobile.com:8443"
    SYNTHETIC_TEST_HEY_CMD_ARGS: "-z 30s -q 15 -c 2"
    SYNTHETIC_TEST_URL: "https://$HELM_APP_NAME.$K8S_DOMAIN/api/deploy/info"

# [px-prd4203] - Istio Canary Deployment
.px-prd4203-vars:
  variables:
    K8S_FOUNDATION: "px-prd4203"
    INGRESS_PROVIDER: "istio"
    HELM_APP_NAME: $CI_PROJECT_NAME-istio
    K8S_DOMAIN: "$K8S_FOUNDATION.mesh.t-mobile.com"
    K8S_API_LOGIN_URL: "pksapi.$K8S_FOUNDATION.tke.t-mobile.com"
    K8S_CLUSTER: "api-$K8S_FOUNDATION.tke.t-mobile.com"
    K8S_SERVER_URL: "https://api-$K8S_FOUNDATION.tke.t-mobile.com:8443"
    CANARY_ISTIO_VIRTUAL_SERVICE_NAME: "$HELM_APP_NAME.$K8S_FOUNDATION.mesh.t-mobile.com"
    SYNTHETIC_TEST_URL: "https://$CANARY_ISTIO_VIRTUAL_SERVICE_NAME/api/deploy/info"
    CANARY_INGRESS_PROVIDER: "$INGRESS_PROVIDER"

### K8s Cluster [px-prd5103]
px-prd5103-deploy:
  stage: deploy
  variables:
    FLAGGER_MONITORING: "true"
    CANARY_PROMOTION_AUTO: "true"
  extends: 
    - .px-prd5103-vars
    - .helm_deploy
  environment:
    name: prod/$K8S_FOUNDATION/development/smoke-$HELM_APP_NAME
    url: $DYNAMIC_ENVIRONMENT_URL/login
    deployment_tier: production
  resource_group: $CI_JOB_NAME-$HELM_APP_NAME

px-prd5103-sanity:
  extends: 
    - .px-prd5103-vars
    - .sanity
  needs: ["px-prd5103-deploy"]
  dependencies: ["px-prd5103-deploy"]
  environment:
    name: prod/$K8S_FOUNDATION/development/smoke-$HELM_APP_NAME
    action: verify
  retry: 1
  when: delayed
  start_in: 90 seconds

validate_px-prd5103-deploy:
  variables:
    VALIDATE_PHASE: "PROMOTION"
  stage: verify
  extends: 
    - .px-prd5103-vars
    - .validate_app
  needs: ["px-prd5103-deploy"]
  dependencies: ["px-prd5103-deploy"]

px-prd5103-rollback:
  stage: rollback
  extends: 
    - .px-prd5103-vars 
    - .helm_rollback
  variables:
     FLAGGER_MONITORING: "true"
  environment:
    name: prod/$K8S_FOUNDATION/development/smoke-$HELM_APP_NAME
    url: $DYNAMIC_ENVIRONMENT_URL/login
    deployment_tier: production
  resource_group: $CI_JOB_NAME-$HELM_APP_NAME
  needs: ["validate_px-prd5103-deploy"]
  rules:
    - if: $PARENT_PIPELINE_SOURCE != "schedule"
      when: manual
      allow_failure: true
    - when: on_success

validate_px-prd5103-rollback:
  variables:
    VALIDATE_PHASE: "ROLLBACK"
  stage: verify-rollback
  extends: 
    - .px-prd5103-vars 
    - .validate_app
  needs: ["px-prd5103-rollback"]

