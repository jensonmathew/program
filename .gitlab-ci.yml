include:
  - project: 'tmobile/templates'
    file:
      - '/gitlab-ci/.tmo.global.common.gitlab-ci.yml'
      - '/gitlab-ci/.tmo.job.mavenTest.gitlab-ci.yml'
      - '/gitlab-ci/.tmo.job.mavenBuild.gitlab-ci.yml'
      - '/gitlab-ci/.tmo.job.mavenPublish.gitlab-ci.yml'
      - '/gitlab-ci/.tmo.job.fortify.gitlab-ci.yml'
      - '/gitlab-ci/.tmo.job.sonar.gitlab-ci.yml'
      - '/gitlab-ci/.tmo.function.pcf.gitlab-ci.yml'
      - '/gitlab-ci/.tmo.function.badge.gitlab-ci.yml'
      - '/gitlab-ci/.tmo.function.ctp-e2egating.gitlab-ci.yml'
      - '/gitlab-ci/.tmo.job.shellcheck.gitlab-ci.yml'
      - '/gitlab-ci/.tmo.job.docker.gitlab-ci.yml'
      - '/gitlab-ci/.tmo.job.container-scan.gitlab-ci.yml'
      - '/gitlab-ci/.tmo.function.helm-deploy.gitlab-ci.yml'
  # PCF NPE, CDE and PRD Variable files
  - local : '/gitlab-ci/vars/.tmo.cdp-pcf-npe.vars.gitlab-ci.yml'
  - local : '/gitlab-ci/vars/.tmo.cdp-pcf-cde.vars.gitlab-ci.yml'
  - local : '/gitlab-ci/vars/.tmo.cdp-pcf-prod.vars.gitlab-ci.yml'

  # Deploy to PCF NPE, CDE and PRD foundations
  - local : '/gitlab-ci/vars/.tmo.deploy-pcf-npe.gitlab-ci.yml' 
  - local : '/gitlab-ci/vars/.tmo.deploy-pcf-cde.gitlab-ci.yml'
  - local : '/gitlab-ci/vars/.tmo.deploy-pcf-prod.gitlab-ci.yml'

stages: 
  - tmo 
  - build
  - test
  - package
  - publish
  - ci
  - validate
  - deploy

testjob:
  stage: tmo
  image: alpine
  script:
    - echo $CI_REPOSITORY_URL

variables:
    # Common Parameters (used by build and deploy)
    APP_VERSION: "1.0"
    BUILD_NUMBER: "$CI_COMMIT_SHORT_SHA"
    
    # Maven Parameters
    MAVEN_PUBLISH_ARGS: "-Dfile=target/${CI_PROJECT_NAME}-${APP_VERSION}-$CI_COMMIT_SHORT_SHA.jar"
    MAVEN_VERSION: "3.6.1-jdk-8"
    JACOCO_COVERAGE_REPORT: "yes"
    UPSTREAM_BRANCH_NAME: ${CI_COMMIT_REF_NAME}
    
    # Sonar Parameters
    CDP_SONAR_PRD: "true"
    
    # PCF Parameters
    PCF_CLI_VERSION: "6.49.0"
    PCF_ORG: "Continuous-Delivery-Platform"
    BUILDPACK: "java_buildpack_offline"
    PCF_INSTANCES: "1" 
    PCF_ROUTE_HOSTNAME: "helloworld"
    PCF_BG_STRATEGY: "GREEN_AUTO_SWITCH"
  
  # Docker parameters 
    DOCKER_BUILD_ARGS: "--build-arg APP_VERSION=$APP_VERSION --build-arg PROJECT_NAME=$CI_PROJECT_NAME --build-arg COMMIT_SHA=$CI_COMMIT_SHORT_SHA"
    AQUA_SCANNER_SCAN: "true" 

# Create json for badges 
pages:
  extends: .badge_pages
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_REF_NAME == "$CI_DEFAULT_BRANCH"
      when: on_success

# Deploy on TKE/PKS K8s cluster
deploy-tke-npe:
  stage: deploy
  extends: .helm_deploy
  variables:
    APP_URL: "https://cdp-helloworld-1-dev."
    DOMAIN: "px-npe1103.pks.t-mobile.com"
  environment:
    name: dlab01/px-npe1103/cdp-dev
    url: $APP_URL$DOMAIN
  resource_group: $CI_JOB_NAME
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - if: $CI_COMMIT_REF_NAME == "$CI_DEFAULT_BRANCH"
      when: on_success
    - if: $CI_COMMIT_REF_NAME != "$CI_DEFAULT_BRANCH" && $DEPLOY_ALL == "true"
      when: on_success
    - when: never
