include:
  - project: 'tmobile/templates'
    file:
      - /gitlab-ci/.tmo.global.common.gitlab-ci.yml
      - /gitlab-ci/.tmo.job.mavenTest.gitlab-ci.yml
      - /gitlab-ci/.tmo.job.mavenBuild.gitlab-ci.yml
      - /gitlab-ci/.tmo.job.mavenPublish.gitlab-ci.yml
      - /gitlab-ci/.tmo.job.fortify.gitlab-ci.yml
      - /gitlab-ci/.tmo.job.sonar.gitlab-ci.yml
      - /gitlab-ci/.tmo.function.badge.gitlab-ci.yml
      - /gitlab-ci/.tmo.function.ctp-e2egating.gitlab-ci.yml
      - /gitlab-ci/.tmo.job.shellcheck.gitlab-ci.yml
      - /gitlab-ci/.tmo.job.docker.gitlab-ci.yml
      - /gitlab-ci/.tmo.function.relic.lictor.gitlab-ci.yml
     # - /gitlab-ci/.tmo.job.container-scan.gitlab-ci.yml

stages: 
  - tmo
  - build
  - test
  - package
  - publish
  - ci
  - push
  - deploy

testjob:
  stage: tmo
  image: alpine
  script:
    - echo $CI_REPOSITORY_URL
    - echo $CI_COMMIT_REF_NAME
    - echo $CI_DEFAULT_BRANCH
    - echo $PARENT_PIPELINE_ID
    - echo $PARENT_PIPELINE_SOURCE

variables:
  # Common
  APP_VERSION: "1.0"
  BUILD_NUMBER: "$CI_COMMIT_SHORT_SHA"
  # Maven
  MAVEN_PUBLISH_ARGS: "-Dfile=target/${CI_PROJECT_NAME}-${APP_VERSION}-$CI_COMMIT_SHORT_SHA.jar"
  JACOCO_COVERAGE_REPORT: "yes"
  # Docker
  DOCKER_BUILD_ARGS: "--build-arg APP_VERSION=$APP_VERSION --build-arg CI_PROJECT_NAME=$CI_PROJECT_NAME --build-arg CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA"
  # Child
  PARENT_PIPELINE_ID: $CI_PIPELINE_ID
  PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE

  MAVEN_BUILD_SINGLE_JOB: "true"

# Create json for badges 
pages:
  extends: .badge_pages
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_REF_NAME == "$CI_DEFAULT_BRANCH"
      when: on_success

# Rules for default branch pipelines
.deploy-rules:
  rules:
   - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH || $DEPLOY_ALL == "true"
     when: on_success
   - when: never

# Rules for feature branch pipelines
.deploy-review-rules:
  rules:
   - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH #only topic branches
     when: never
   - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "trigger" #pushes only
     when: on_success
   - when: never

# PCF Deployment - Review, NPE & Prod
review-pcf:
  stage: deploy
  trigger:
    include: .gitlab-ci/deploy/helloworld/pcf/review.yaml
    strategy: depend
  rules:
   - if: '$SKIP_REVIEW_PCF_DEPLOY'
     when: never
   - !reference [.deploy-review-rules, rules]

npe-pcf:
  stage: deploy
  trigger:
    include: .gitlab-ci/deploy/helloworld/pcf/npe.yaml
    strategy: depend
  rules:
   - if: '$SKIP_NPE_PCF_DEPLOY'
     when: never
   - !reference [.deploy-rules, rules]

prod-pcf:
  stage: deploy
  trigger:
    include: .gitlab-ci/deploy/helloworld/pcf/prod.yaml
    strategy: depend
  rules:
   - if: '$SKIP_PROD_PCF_DEPLOY'
     when: never
   - !reference [.deploy-rules, rules]


# K8s TKE Deployments - Review, NPE & PROD
.review-k8s-tke:
  stage: deploy
  variables:
    K8S_FOUNDATION: "px-npe2203"
  trigger:
    include: .gitlab-ci/deploy/helloworld/k8s-tke/review.yaml
    strategy: depend
  rules:
   - if: '$SKIP_REVIEW_K8S_TKE_DEPLOY'
     when: never
   - !reference [.deploy-review-rules, rules]

.npe-k8s-tke:
  stage: deploy
  variables:
    K8S_DEPLOY_STRATEGY: "BLUE_GREEN"
    K8S_FOUNDATION: "tt-prd2103"
  trigger:
    include: .gitlab-ci/deploy/helloworld/k8s-tke/npe-stg.yaml
    strategy: depend
  rules:
    - if: '$SKIP_NPE_K8S_TKE_DEPLOY'
      when: never
    - !reference [.deploy-rules, rules]

# Review - K8s-TKE NGINX Deployment, Strategy (Default - ROLLING_UPDATE)
review-k8s-tke[nginx]:
  extends: .review-k8s-tke
  variables:
    K8S_DOMAIN: "$K8S_FOUNDATION.tke.t-mobile.com"
    HELM_APP_NAME: review-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG

# Review - K8s-TKE ISTIO Deployment, Strategy (Default - ROLLING_UPDATE)
review-k8s-tke[istio]:
  extends: .review-k8s-tke
  variables:
    K8S_DOMAIN: "$K8S_FOUNDATION.mesh.t-mobile.com"
    HELM_APP_NAME: review-istio-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG
    INGRESS_PROVIDER: "istio"

# NPE - K8s-TKE NGINX Deployment, Strategy - BLUE_GREEN
npe-k8s-tke[nginx-b/g]:
  extends: .npe-k8s-tke
  variables:
    HELM_APP_NAME: $CI_PROJECT_NAME
    K8S_DOMAIN: "$K8S_FOUNDATION.tke.t-mobile.com"

# NPE - K8s-TKE ISTIO Deployment, Strategy - BLUE_GREEN
npe-k8s-tke[istio-b/g]:
  extends: .npe-k8s-tke
  variables:
    HELM_APP_NAME: $CI_PROJECT_NAME-istio
    K8S_DOMAIN: "$K8S_FOUNDATION.mesh.t-mobile.com"
    INGRESS_PROVIDER: "istio"
    CANARY_INGRESS_PROVIDER: "$INGRESS_PROVIDER"
    CANARY_ISTIO_VIRTUAL_SERVICE_NAME: "$HELM_APP_NAME.$K8S_FOUNDATION.mesh.t-mobile.com"

prod-k8s-tke:
  stage: deploy
  variables:
    K8S_DEPLOY_STRATEGY: "CANARY"
    K8S_NS: "cdp-helloworld-prd"
  trigger:
    include: .gitlab-ci/deploy/helloworld/k8s-tke/prod.yaml
    strategy: depend
  rules:
    - if: '$SKIP_PROD_K8S_TKE_DEPLOY'
      when: never
    - !reference [.deploy-rules, rules]

