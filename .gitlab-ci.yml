# K8s Kind Ephemeral deployment
ephm-k8s-kind:
  stage: deploy
  trigger:
    include: .gitlab-ci/deploy/helloworld/k8s-kind/ephemeral.yaml
    strategy: depend
  rules:
   - if: '$SKIP_EPHM_K8S_DEPLOY'
     when: never
   - !reference [.deploy-review-rules, rules]

# Push configuration to NPE Relic
lictor_job_npe:
  extends: .lictor-template
  stage: push
  variables:
    CI_ENVIRONMENT: "qlab01" # tmobile/L2/L3/env/branch/config
    DATACENTER: "npeprd"
    # Optional
    CONFIG_ROOT_DIR: "config"
    LICTOR_LOG_LEVEL: "trace"
  rules:
   - if: '$SKIP_LICTOR_RUN_NPE'
     when: never
   - !reference [.deploy-rules, rules]

# Push configuration to PROD Relic
lictor_job_prod:
  extends: .lictor-template
  stage: push
  variables:
    CI_ENVIRONMENT: "prod" # tmobile/L2/L3/env/branch/config
    DATACENTER: "prd"
    # Optional
    CONFIG_ROOT_DIR: "config"
    LICTOR_LOG_LEVEL: "trace"
  rules:
   - if: '$SKIP_LICTOR_RUN_PROD'
     when: never
   - if: '$SKIP_PROD_PCF_DEPLOY'
     when: never
   - !reference [.deploy-rules, rules]
