# Injection of templates
include:
  # Injects TMO Global Shared (handles certs, lists blacklisted files etc.)  
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.global.common.gitlab-ci.yml'
    
  # Injects Maven Test
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.job.mavenTest.gitlab-ci.yml'

  # Injects Maven Build
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.job.mavenBuild.gitlab-ci.yml'

  # Injects Maven Publish
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.job.mavenPublish.gitlab-ci.yml'

  # Injects SonarScan capability
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.job.sonar.gitlab-ci.yml'
    
  # Injects PCF Deploy function
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.function.pcf.gitlab-ci.yml'

  # Injects badging function
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.function.badge.gitlab-ci.yml'
    
   # PCF NPE, CDE and PRD Variable file
  - local : '.tmo.cdp-pcf-npe.vars.gitlab-ci.yml'
  - local : '.tmo.cdp-pcf-cde.vars.gitlab-ci.yml'
  - local : '.tmo.cdp-pcf-prod.vars.gitlab-ci.yml'

   #Deploy to PCF NPE, CDE and PRD foundations
  - local : '.tmo.deploy-pcf-npe.gitlab-ci.yml' 
  - local : '.tmo.deploy-pcf-cde.gitlab-ci.yml'
  - local : '.tmo.deploy-pcf-prod.gitlab-ci.yml'

stages: 
  - tmo 
  - build
  - test
  - scan
  - publish
  - deploy-npe
  - deploy-prod
  - deploy-cde
  - trigger-downstream

variables:
    # Common Parameters (used by build and deploy)
    APP_VERSION: "1.0"
    BUILD_NUMBER: "$CI_COMMIT_SHORT_SHA"
    
    # Maven Parameters
    MAVEN_PUBLISH_ARGS: "-Dfile=target/${CI_PROJECT_NAME}-${APP_VERSION}-$CI_COMMIT_SHORT_SHA.jar"
    MAVEN_VERSION: "3.6.1-jdk-8"
    JACOCO_COVERAGE_REPORT: "yes"
    UPSTREAM_BRANCH_NAME: ${CI_COMMIT_REF_NAME}
    
    # PCF Parameters
    PCF_CLI_VERSION: "6.49.0"
    PCF_ORG: "Continuous-Delivery-Platform"
    BUILDPACK: "java_buildpack_offline"
    PCF_INSTANCES: "1" 
    PCF_ROUTE_HOSTNAME: "${CI_PROJECT_NAME}-${PCF_SPACE}"
    PCF_APP_NAME: "${CI_PROJECT_NAME}-${PCF_SPACE}"

# Deploy to Development environment
deploy-dev:
  extends: .pcf-deploy
  stage: deploy
  except:
    - /^tmo\/.*$/
  environment:
    name: dev
  
# Deploy to Staging environment   
deploy-stg:
  extends: .pcf-deploy
  stage: deploy
  only:
    - /^tmo\/.*$/
  environment:
    name: stg    
   
# Deploy to Production environment    
deploy-prd:
  extends: .pcf-deploy
  stage: deploy
  only:
    - tmo/master
  environment:
    name: prd

# Trigger a multi project pipeline using a bridge job
helloworld-downstream-bridge:
# Downstream jobs can access all upstream variables
# Save upstream gitlab predefined variables to pass downstream
  variables:
    UPSTREAM_PROJECT_ID: ${CI_PROJECT_ID}
    UPSTREAM_JOB_NAME: ${CI_JOB_NAME}
    UPSTREAM_JOB_STAGE: ${CI_JOB_STAGE}
  stage: trigger-downstream
  trigger: 
    project: tmobile/templates_projects/helloworld-downstream
    # make bridge job status mirror downstream pipeline status
    strategy: depend
    branch: tmo/master
    
# Create json for badges 
pages:
  extends: .badge_pages
  rules:
    - if: $CI_COMMIT_REF_NAME == "tmo/master"
      when: on_success
