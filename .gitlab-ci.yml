include:
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.global.common.gitlab-ci.yml'
    
  # Injects Maven Test
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.job.mavenTest.gitlab-ci.yml'

  # Injects Maven Build
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.job.mavenBuild.gitlab-ci.yml'

  # Injects Maven Publish
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.job.mavenPublish.gitlab-ci.yml'

  # Injects Fortify Publish
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.job.fortify.gitlab-ci.yml'

  # Injects SonarScan capability
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.job.sonar.gitlab-ci.yml'
    
  # Injects PCF Deploy function
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.function.pcf.gitlab-ci.yml'

  # Injects badging function
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.function.badge.gitlab-ci.yml'

  # Inject Artifactory functions
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.job.jfrog-artifact.gitlab-ci.yml'
    
  # Injects CTP
  - project: 'tmobile/templates'
    ref: tmo/master
    file: '/gitlab-ci/.tmo.function.ctp-e2egating.gitlab-ci.yml'

   # PCF NPE, CDE and PRD Variable files
  - local : '/gitlab-ci/vars/.tmo.cdp-pcf-npe.vars.gitlab-ci.yml'
  - local : '/gitlab-ci/vars/.tmo.cdp-pcf-cde.vars.gitlab-ci.yml'
  - local : '/gitlab-ci/vars/.tmo.cdp-pcf-prod.vars.gitlab-ci.yml'

   #Deploy to PCF NPE, CDE and PRD foundations
  - local : '/gitlab-ci/vars/.tmo.deploy-pcf-npe.gitlab-ci.yml' 
  - local : '/gitlab-ci/vars/.tmo.deploy-pcf-cde.gitlab-ci.yml'
  - local : '/gitlab-ci/vars/.tmo.deploy-pcf-prod.gitlab-ci.yml'

stages: 
  - tmo 
  - build
  - test
  - scan
  - publish
  - tag
  - deploy-npe
  - validate
  - deploy-prod
  - deploy-cde
  - trigger-downstream

testjob:
  stage: tmo
  image: alpine
  script:
    - echo $CI_REPOSITORY_URL

variables:
    # Common Parameters (used by build and deploy)
    APP_VERSION: "1.0"
    BUILD_NUMBER: "$CI_COMMIT_SHORT_SHA"
    
    # Maven Parameters
    MAVEN_PUBLISH_ARGS: "-Dfile=target/${CI_PROJECT_NAME}-${APP_VERSION}-$CI_COMMIT_SHORT_SHA.jar"
    MAVEN_VERSION: "3.6.1-jdk-8"
    JACOCO_COVERAGE_REPORT: "yes"
    UPSTREAM_BRANCH_NAME: ${CI_COMMIT_REF_NAME}
    ENVIRONMENT: "dev"
    
    # PCF Parameters
    PCF_CLI_VERSION: "6.49.0"
    PCF_ORG: "Continuous-Delivery-Platform"
    BUILDPACK: "java_buildpack_offline"
    PCF_INSTANCES: "1" 
    PCF_ROUTE_HOSTNAME: "cdp-${CI_PROJECT_NAME}-${PCF_SPACE}"
    PCF_APP_NAME: "${PCF_ROUTE_HOSTNAME}"
  
   # e2e gating/qTest parameters
    CODE_LOCATION: "git@${CI_SERVER_HOST}:${CI_PROJECT_PATH}.git"
    BIT_BUCKET_BRANCH: ${CI_COMMIT_REF_NAME}
    BUILD_FILE_LOCATION: pom.xml
    BUILD_TYPE: MAVEN
    BUILD_COMMAND: "helloworld-cdp-qtest-tc.xlsx"
    TEST_APPLICATION: ${CI_PROJECT_NAME}
    WAIT: "2040"
    TEST_FRAMEWORK: "CODELESS_BYOT"
    TEST_SUITE: "CDP-qTest-POC"
    TEST_ENVIRONMENT: "NA"

    # Artifactory Paramaters
    ARTIFACT_REPO: "cdp-maven-prd"
    TARGET_PATH: "${ARTIFACT_REPO}/${CI_PROJECT_NAME}/${APP_VERSION}/${CI_PIPELINE_IID}/"
    ARTIFACT_DIR: "./target/*.jar"
    GROUP_ID: "cdp/helloworld-1"

# Tag Artifactory Artifact
artifactory-tag-artifact:
  extends: .tag-artifact
  variables:
    ARTIFACT_NAME: "helloworld-1-${APP_VERSION}-${CI_COMMIT_SHORT_SHA}.jar"
    ARTIFACT_PROPS: "TAG_TEST=SUCCESSFUL"

# Trigger a multi project pipeline using a bridge job
helloworld-downstream-bridge:
# Downstream jobs can access all upstream variables
# Save upstream gitlab predefined variables to pass downstream
  variables:
    UPSTREAM_PROJECT_ID: ${CI_PROJECT_ID}
    UPSTREAM_JOB_NAME: ${CI_JOB_NAME}
    UPSTREAM_JOB_STAGE: ${CI_JOB_STAGE}
  stage: trigger-downstream
  trigger: 
    project: tmobile/templates_projects/helloworld-downstream
    # make bridge job status mirror downstream pipeline status
    strategy: depend
    branch: tmo/master
    
# Create json for badges 
pages:
  extends: .badge_pages
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_REF_NAME == "$CI_DEFAULT_BRANCH"
      when: on_success

e2egating:
    extends: .ctp
    stage: validate
    allow_failure: true
    rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        when: never
      - if: $CI_PIPELINE_SOURCE == "schedule"
        when: never
      - when: on_success
